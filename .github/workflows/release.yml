name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'richyss-apk-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore durable release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RICHYSS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RICHYSS_KEYSTORE_BASE64 is not configured; the release APK will be signed with the debug key and cannot be used as an update of a previously signed install."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/richyss-release.jks"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble release APK
        env:
          RICHYSS_KEYSTORE_PATH: ${{ runner.temp }}/signing/richyss-release.jks
          RICHYSS_KEYSTORE_PASSWORD: ${{ secrets.RICHYSS_KEYSTORE_PASSWORD }}
          RICHYSS_KEY_ALIAS: ${{ secrets.RICHYSS_KEY_ALIAS }}
          RICHYSS_KEY_PASSWORD: ${{ secrets.RICHYSS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/richyss-apk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
